name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack and find project
        id: find
        run: |
          mkdir -p _unz
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d _unz; done
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Show compile errors
        if: failure()
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "===== COMPILE ERRORS ====="
          grep -E "^e: " build.log | sed 's#.*/escooter/##' || echo "no compile errors found"
      - uses: actions/upload-artifact@v4
        with:
          name: E-scooter-App-3.0
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/*.apk
